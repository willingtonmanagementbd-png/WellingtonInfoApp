name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove duplicate logo jpg
        run: rm -f app/src/main/res/drawable/logo.jpg

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WellingtonManagement.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WellingtonManagement-APK
          path: app/build/outputs/apk/debug/WellingtonManagement.apk
